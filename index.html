<!doctype html>
<html lang="es" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tilde</title>
<meta name="description" content="Tilde — registro de evaluaciones por examen">
<meta name="theme-color" content="#26262a">
<!-- Tilde v1.1.0 -->
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/favicon.ico" sizes="any">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/svg+xml" href="icons/icon.svg">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Tilde">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet">
<style>
/* ===================== Tokens ===================== */
:root{
  --bg:#f4eee4; --surface:#fffaf2; --surface-2:#efe6d8; --border:#e1d6c4;
  --text:#2a2a2e; --muted:#6e675e; --accent:#7f62cc; --accent-strong:#6447b5; --accent-soft:#ebe4fa; --on-accent:#ffffff;
  --header:#26262a; --on-header:#f4eee4;
  --ok:#16a34a; --ok-soft:#dcf3e3; --bad:#dc2626; --bad-soft:#fbe0e0; --nr:#86868e; --nr-soft:#e8e6e3;
  --shadow:0 1px 2px rgba(40,30,20,.06),0 4px 14px rgba(40,30,20,.06);
  --radius:14px; --nav-h:64px;
  --font:'DM Sans',system-ui,-apple-system,Segoe UI,Roboto,sans-serif; --display:'Bebas Neue',var(--font);
}
:root[data-theme="dark"]{
  --bg:#1b1b1e; --surface:#252529; --surface-2:#2f2f34; --border:#3b3b42;
  --text:#f2ede5; --muted:#a8a29a; --accent:#b49ef0; --accent-strong:#c9b8ff; --accent-soft:#342d4a; --on-accent:#1b1b1e;
  --header:#141416; --on-header:#f2ede5;
  --ok:#22c55e; --ok-soft:#173a25; --bad:#f05252; --bad-soft:#4a1d1d; --nr:#9a9aa2; --nr-soft:#38383e;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font);font-size:16px;line-height:1.4;-webkit-tap-highlight-color:transparent}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
.hidden{display:none!important}
.muted{color:var(--muted)}
.small{font-size:.85rem}

/* ===================== Header ===================== */
.hdr{position:sticky;top:0;z-index:30;background:var(--header);color:var(--on-header);display:flex;align-items:center;gap:10px;padding:10px 16px;padding-top:calc(10px + env(safe-area-inset-top))}
.brand{display:flex;align-items:center;gap:8px;font-family:var(--display);font-size:1.7rem;letter-spacing:.06em;line-height:1}
.brand svg{width:26px;height:26px}
.brand .ver{font-family:var(--font);font-size:.7rem;letter-spacing:0;opacity:.6;margin-left:2px}
.hdr .sp{flex:1}
.sync{display:flex;align-items:center;gap:7px;font-size:.8rem;font-weight:600;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.14);color:inherit;border-radius:999px;padding:5px 11px 5px 9px;max-width:46vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sync:hover{background:rgba(255,255,255,.13)}
.sync .dot{flex:none;width:10px;height:10px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 2px rgba(255,255,255,.08)}
.sync.saving .dot{background:#f5b301;animation:pulse 1s infinite}
.sync.pending .dot{background:#f05252}
.sync.off .dot{background:#9a9aa2}
.dotg2{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:8px;vertical-align:-1px;background:var(--ok)}
.dotg2.saving{background:#f5b301}.dotg2.pending{background:var(--bad)}.dotg2.off{background:var(--nr)}
.kv{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 14px;border-top:1px solid var(--border);font-size:.9rem}
.kv:first-child{border-top:0}
.kv>span{color:var(--muted)}
.kv>b{font-weight:600;text-align:right}
.kv.col{flex-direction:column;align-items:flex-start;gap:3px}
.kv.col>b{text-align:left}
@keyframes pulse{50%{opacity:.3}}
.icon-btn{background:transparent;border:0;color:inherit;width:38px;height:38px;border-radius:10px;display:grid;place-items:center}
.icon-btn:hover{background:rgba(255,255,255,.1)}
.icon-btn svg{width:20px;height:20px}
.btn-install{background:var(--accent);color:var(--on-accent);border:0;border-radius:10px;padding:7px 12px;font-weight:600;font-size:.85rem}
.demo-bar{background:var(--accent-soft);color:var(--accent-strong);text-align:center;font-size:.82rem;padding:6px 12px;font-weight:600}

/* ===================== Layout ===================== */
.layout{display:flex;min-height:calc(100vh - 58px)}
.nav{display:flex}
.nav button{background:transparent;border:0;display:flex;align-items:center;gap:10px;color:var(--muted);font-weight:600}
.nav button svg{width:22px;height:22px}
.nav button.on{color:var(--accent-strong)}
main{flex:1;min-width:0;padding:16px;padding-bottom:calc(var(--nav-h) + 24px + env(safe-area-inset-bottom))}
.wrap{max-width:760px;margin:0 auto}
.wrap.wide{max-width:1180px}
@media (max-width:899px){
  .nav{position:fixed;bottom:0;left:0;right:0;z-index:25;background:var(--surface);border-top:1px solid var(--border);height:calc(var(--nav-h) + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom)}
  .nav button{flex:1;flex-direction:column;justify-content:center;gap:3px;font-size:.7rem}
}
@media (min-width:900px){
  .nav{flex-direction:column;width:210px;padding:18px 10px;gap:4px;border-right:1px solid var(--border);background:var(--surface);position:sticky;top:58px;height:calc(100vh - 58px)}
  .nav button{padding:11px 14px;border-radius:10px;font-size:.95rem}
  .nav button:hover{background:var(--surface-2)}
  .nav button.on{background:var(--accent-soft)}
  main{padding:24px 28px 40px}
  .nav{transition:width .15s}
  .nav-toggle{margin-top:auto}
  body.nav-col .nav{width:68px;padding:18px 8px}
  body.nav-col .nav button{justify-content:center;padding:11px 0}
  body.nav-col .nav button span{display:none}
}
@media (max-width:899px){.nav-toggle{display:none!important}}

/* ===================== Componentes ===================== */
h1.title{font-family:var(--display);font-weight:400;font-size:2rem;letter-spacing:.04em;margin:4px 0 2px}
.subtitle{color:var(--muted);margin:0 0 16px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow)}
.pad{padding:16px}
.row{display:flex;align-items:center;gap:10px}
.row.wrapr{flex-wrap:wrap}
.grow{flex:1;min-width:0}
.btn{border:1px solid var(--border);background:var(--surface);border-radius:12px;padding:11px 16px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn svg{width:18px;height:18px}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.primary:hover{background:var(--accent-strong)}
.btn.block{width:100%}
.btn.big{padding:15px 18px;font-size:1.05rem}
.btn.sm{padding:7px 11px;font-size:.85rem;border-radius:10px}
.btn.danger{color:var(--bad)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.busy{pointer-events:none;opacity:.7}
.btn.busy::after{content:'';width:14px;height:14px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.field label{font-size:.85rem;font-weight:600;color:var(--muted)}
.input{width:100%;background:var(--surface);border:1.5px solid var(--border);border-radius:12px;padding:12px 14px;outline:none}
.input:focus{border-color:var(--accent)}
.search{position:relative}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--muted)}
.search .input{padding-left:40px}
.seg{display:flex;background:var(--surface-2);border-radius:12px;padding:4px;gap:4px}
.seg button{flex:1;border:0;background:transparent;border-radius:9px;padding:9px 10px;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--text);box-shadow:var(--shadow)}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:.75rem;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--surface-2);color:var(--muted)}
.chip.acc{background:var(--accent-soft);color:var(--accent-strong)}
.chip.c{background:var(--ok-soft);color:var(--ok)} .chip.i{background:var(--bad-soft);color:var(--bad)} .chip.n{background:var(--nr-soft);color:var(--nr)}
.chip.off{background:transparent;border:1px dashed var(--border)}
button.chip{border:0}
.list{display:flex;flex-direction:column;gap:8px}
.item{display:flex;align-items:center;gap:12px;padding:14px 16px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);text-align:left;width:100%}
button.item:hover{border-color:var(--accent)}
.item .t{font-weight:600}
.item .s{font-size:.82rem;color:var(--muted)}
.item .chev{color:var(--muted);width:18px;height:18px;flex:none}
.empty{padding:30px 16px;text-align:center;color:var(--muted)}
.bar{height:6px;background:var(--surface-2);border-radius:99px;overflow:hidden}
.bar>span{display:block;height:100%;background:var(--accent)}
.stack{display:flex;height:10px;border-radius:99px;overflow:hidden;background:var(--surface-2)}
.stack .c{background:var(--ok)} .stack .i{background:var(--bad)} .stack .n{background:var(--nr)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:14px}
.kpi{padding:14px 16px}
.kpi .v{font-family:var(--display);font-size:2rem;letter-spacing:.03em;line-height:1}
.kpi .l{font-size:.8rem;color:var(--muted);margin-top:4px}
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}

/* ===================== Wizard ===================== */
.steps{display:flex;gap:6px;margin:0 0 14px}
.steps div{flex:1;height:4px;border-radius:99px;background:var(--border)}
.steps div.on{background:var(--accent)}
.wz-head{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.wz-head .back{flex:none;border:1px solid var(--border);background:var(--surface);border-radius:12px;width:42px;height:42px;display:grid;place-items:center}
.wz-head .back svg{width:20px;height:20px}
.wz-head .t{font-weight:700;font-size:1.05rem;line-height:1.2}
.wz-head .s{font-size:.82rem;color:var(--muted)}
.stepname{font-size:.75rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--accent-strong);margin-bottom:2px}
.act-row{background:var(--surface);border:1px solid var(--border);border-left:5px solid var(--border);border-radius:var(--radius);padding:12px 12px 12px 14px}
.act-row.C{border-left-color:var(--ok)} .act-row.I{border-left-color:var(--bad)} .act-row.N{border-left-color:var(--nr)}
.act-row.flash{animation:flash .9s}
@keyframes flash{30%{box-shadow:0 0 0 3px var(--accent)}}
.act-head{display:flex;gap:10px;align-items:baseline;margin-bottom:10px}
.act-num{font-family:var(--display);font-size:1.3rem;color:var(--muted);min-width:22px}
.act-code{font-weight:700;font-size:.85rem;color:var(--accent-strong)}
.act-desc{font-size:.95rem}
.grades{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.g{min-height:58px;border-radius:12px;border:2px solid var(--border);background:var(--surface);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-weight:700;font-size:.8rem;color:var(--muted);transition:transform .08s}
.g:active{transform:scale(.97)}
.g svg{width:22px;height:22px}
.g.C{color:var(--ok)} .g.I{color:var(--bad)} .g.N{color:var(--nr)}
.g.C.sel{background:var(--ok);border-color:var(--ok);color:#fff}
.g.I.sel{background:var(--bad);border-color:var(--bad);color:#fff}
.g.N.sel{background:var(--nr);border-color:var(--nr);color:#fff}
.sticky-bot{position:sticky;bottom:calc(var(--nav-h) + 10px + env(safe-area-inset-bottom));margin-top:14px;z-index:5}
@media (min-width:900px){.sticky-bot{bottom:16px}}
.sticky-bot .card{padding:10px;display:flex;gap:10px;align-items:center}
.sum3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
.sum3 .card{padding:14px 10px;text-align:center}
.sum3 .v{font-family:var(--display);font-size:2.4rem;line-height:1}
.sum3 .l{font-size:.78rem;font-weight:700}
.sum3 .p{font-size:.78rem;color:var(--muted)}
.dotg{width:12px;height:12px;border-radius:50%;flex:none}
.dotg.C{background:var(--ok)} .dotg.I{background:var(--bad)} .dotg.N{background:var(--nr)}
.mini{display:flex;gap:4px}

/* ===================== Tablas / reportes ===================== */
.tbl-wrap{overflow:auto;border:1px solid var(--border);border-radius:var(--radius);background:var(--surface)}
table.tbl{border-collapse:separate;border-spacing:0;width:100%;font-size:.88rem}
.tbl th,.tbl td{padding:9px 10px;border-bottom:1px solid var(--border);text-align:left;white-space:nowrap}
.tbl th{background:var(--surface-2);font-size:.75rem;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);position:sticky;top:0;z-index:1}
.tbl tr:last-child td{border-bottom:0}
.tbl .stick{position:sticky;left:0;background:var(--surface);z-index:2}
.tbl th.stick{z-index:3;background:var(--surface-2)}
.tbl td.ctr,.tbl th.ctr{text-align:center}
.tbl tfoot td{background:var(--surface-2);font-weight:700}
.tbl tfoot td.stick{background:var(--surface-2)}
.cell{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:8px;font-weight:700;font-size:.8rem;color:#fff}
.cell.C{background:var(--ok)} .cell.I{background:var(--bad)} .cell.N{background:var(--nr)} .cell.x{background:var(--surface-2);color:var(--muted)}
.pct-lo{color:var(--bad)} .pct-mid{color:#c27c00} .pct-hi{color:var(--ok)}
:root[data-theme="dark"] .pct-mid{color:#f5b301}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.8rem;color:var(--muted);margin:10px 2px}
.legend>span{display:inline-flex;align-items:center;gap:6px}

/* ===================== Modal / toast / pantallas ===================== */
.modal-bg{position:fixed;inset:0;background:rgba(10,10,12,.55);z-index:60;display:flex;align-items:flex-end;justify-content:center}
@media (min-width:700px){.modal-bg{align-items:center;padding:20px}}
.modal{background:var(--bg);width:100%;max-width:640px;max-height:92vh;overflow:auto;border-radius:20px 20px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom))}
@media (min-width:700px){.modal{border-radius:20px}}
.modal.wide{max-width:980px}
.modal h2{font-family:var(--display);font-weight:400;font-size:1.6rem;letter-spacing:.04em;margin:0 0 14px}
.modal .acts{display:flex;gap:10px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}
.notice{background:var(--accent-soft);color:var(--accent-strong);border-radius:12px;padding:10px 12px;font-size:.88rem;font-weight:500;margin-bottom:12px}
.err{color:var(--bad);font-size:.88rem;min-height:1.2em;margin-top:6px}
.picker{display:grid;grid-template-columns:1fr;gap:12px}
@media (min-width:760px){.picker{grid-template-columns:1fr 1fr}}
.picker .col{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:10px;max-height:46vh;overflow:auto}
.pk{display:flex;align-items:center;gap:8px;padding:8px;border-radius:10px}
.pk:hover{background:var(--surface-2)}
.pk .grow .c{font-weight:700;font-size:.8rem;color:var(--accent-strong)}
.pk .grow .d{font-size:.85rem}
.mini-btn{border:1px solid var(--border);background:var(--surface);border-radius:8px;width:32px;height:32px;display:grid;place-items:center;flex:none}
.mini-btn svg{width:16px;height:16px}
.mini-btn:disabled{opacity:.3}
.toasts{position:fixed;left:50%;transform:translateX(-50%);top:calc(66px + env(safe-area-inset-top));z-index:80;display:flex;flex-direction:column;gap:8px;width:min(92vw,420px);pointer-events:none}
@media (min-width:900px){.toasts{top:auto;bottom:24px}}
.toast{background:var(--header);color:var(--on-header);padding:12px 16px;border-radius:12px;box-shadow:var(--shadow);font-size:.92rem;animation:tin .2s}
.toast.error{background:var(--bad);color:#fff}
@keyframes tin{from{opacity:0;transform:translateY(-8px)}}
.screen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.login{width:100%;max-width:400px;padding:28px 24px}
.login .logo{display:flex;flex-direction:column;align-items:center;gap:6px;margin-bottom:22px}
.login .logo svg{width:64px;height:64px}
.login .logo .n{font-family:var(--display);font-size:2.6rem;letter-spacing:.08em;line-height:1}
.pin-input{letter-spacing:.5em;text-align:center;font-size:1.5rem;font-weight:700}
.spinner{width:36px;height:36px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 14px}
.center{text-align:center}
</style>
</head>
<body>

<div id="screen" class="screen hidden"></div>

<div id="app" class="hidden">
  <header class="hdr">
    <div class="brand"><span id="brandIcon"></span><span id="brandName">Tilde</span><span class="ver" id="brandVer"></span></div>
    <div class="sp"></div>
    <button class="sync ok" id="sync" title="Sincronización"><span class="dot"></span><span id="syncTxt">…</span></button>
    <button class="btn-install hidden" id="btnInstall">Instalar</button>
    <button class="icon-btn" id="btnTheme" title="Modo claro / oscuro" aria-label="Cambiar tema"></button>
    <button class="icon-btn" id="btnLogout" title="Cerrar sesión" aria-label="Cerrar sesión"></button>
  </header>
  <div class="demo-bar hidden" id="demoBar">Modo demo — datos de prueba guardados solo en este navegador (no toca el Sheet)</div>
  <div class="layout">
    <nav class="nav" id="nav"></nav>
    <main id="main"></main>
  </div>
</div>

<div class="toasts" id="toasts"></div>
<div id="modalRoot"></div>

<script>
'use strict';
/* =====================================================================
   Tilde — PWA de evaluaciones por examen · v1.1.0 · 11-oct-2026
   Backend: Tilde_v1.1.0.gs (GAS Web App). Modo demo: agregar ?demo=1 a la URL.
   v1.1.0: local-first (copia en el dispositivo + cola de cambios con reintento), GET para leer,
           sesión sin vencimiento revocable, círculo de 4 estados + panel de sincronización,
           IDs invisibles, menú lateral colapsable, fix de íconos de la leyenda.
   ===================================================================== */
const CONFIG = {
  APP_NAME: 'Tilde',                 // parametrizable
  APP_VERSION: '1.1.0',
  GAS_URL: 'https://script.google.com/macros/s/AKfycbwMmuk3pE8YAcvoV4uIKQiSeG-gjsNyr3nUV3LB0aDj4MwZcUHkKR5hzr6ZICoLoFr9/exec',
  LS: 'tilde_',
  TIMEOUT_MS: 30000,
  RETRY_MS: 15000,
  ACT_MIN: 10, ACT_MAX: 15           // rango recomendado (solo aviso)
};
const DEMO = !CONFIG.GAS_URL || new URLSearchParams(location.search).has('demo');
const ESTADOS = {
  C: { label: 'Correcto', short: 'Correcto', ic: 'check' },
  I: { label: 'Incorrecto', short: 'Incorrecto', ic: 'x' },
  N: { label: 'No responde', short: 'No resp.', ic: 'minus' }
};

/* ---------------- Íconos ---------------- */
const ICONS = {
  logo: '<svg viewBox="0 0 512 512"><rect width="512" height="512" rx="120" fill="#26262a"/><path d="M262 156 L322 92" stroke="#b49ef0" stroke-width="46" stroke-linecap="round" fill="none"/><rect x="132" y="198" width="248" height="62" rx="16" fill="#f4eee4"/><rect x="225" y="198" width="62" height="226" rx="16" fill="#f4eee4"/></svg>',
  check: '<path d="M5 12.5l4.5 4.5L19 7.5"/>',
  x: '<path d="M6 6l12 12M18 6L6 18"/>',
  minus: '<path d="M6 12h12"/>',
  back: '<path d="M15 5l-7 7 7 7"/>',
  chev: '<path d="M9 5l7 7-7 7"/>',
  search: '<circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4.2-4.2"/>',
  sun: '<circle cx="12" cy="12" r="4"/><path d="M12 2.5v2.2M12 19.3v2.2M4.6 4.6l1.6 1.6M17.8 17.8l1.6 1.6M2.5 12h2.2M19.3 12h2.2M4.6 19.4l1.6-1.6M17.8 6.2l1.6-1.6"/>',

/* =====================================================================
   API — GET para leer, POST solo para validarPIN y el lote de cambios.
   Lecciones de PreKOM: GET falla menos en el salto exec→googleusercontent (v8.3.0)
   y no hay corte propio de tiempo (v7.1.6). El 404 intermitente se trata como
   "sin conexión": el cambio queda en la cola y se reintenta solo.
   ===================================================================== */
const LSP = DEMO ? 'demo_' : '';                 // el modo demo usa sus propias claves locales
const RETRY_MS = [3000, 8000, 20000, 30000];     // espera entre reintentos tras una falla
function getSession() { return store.get(LSP + 'session', null); }
function netError(msg) { const e = new Error(msg || 'Sin conexión'); e.network = true; return e; }
const pad2 = n => String(n).padStart(2, '0');
const hhmm = iso => { const d = new Date(iso); return pad2(d.getHours()) + ':' + pad2(d.getMinutes()); };
const fechaHora = iso => { const d = new Date(iso); return pad2(d.getDate()) + '/' + pad2(d.getMonth() + 1) + ' ' + hhmm(iso); };
function uid(prefijo) {
  const r = (window.crypto && crypto.randomUUID) ? crypto.randomUUID().replace(/-/g, '') : (Date.now().toString(16) + Math.random().toString(16).slice(2));
  return prefijo + '-' + r.slice(0, 12);
}

async function http(method, params) {
  if (navigator.onLine === false) throw netError('Sin red');
  if (DEMO) return MOCK.call(method, params);
  let res;
  try {
    if (method === 'GET') {
      const qs = Object.keys(params).filter(k => params[k] != null && params[k] !== '')
        .map(k => encodeURIComponent(k) + '=' + encodeURIComponent(params[k])).join('&');
      res = await fetch(CONFIG.GAS_URL + '?' + qs + '&_=' + Date.now(), { method: 'GET', redirect: 'follow', cache: 'no-store' });
    } else {
      res = await fetch(CONFIG.GAS_URL, {
        method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(params), redirect: 'follow'
      });
    }
  } catch (e) { throw netError(); }
  if (!res.ok) throw netError('HTTP ' + res.status);              // el 404 intermitente de Apps Script cae acá
  const txt = await res.text();
  try { return JSON.parse(txt); } catch (e) { throw netError('Respuesta no válida del servidor'); }
}
const esRevocada = r => r && r.motivo === 'sesion_invalida';

/* =====================================================================
   Estado + copia local (local-first, patrón RegMed)
   ===================================================================== */
const vacio = () => ({ alumnos: [], actividades: [], examenes: [], evaluaciones: [] });
const S = {
  data: store.get(LSP + 'data', null) || vacio(),
  view: 'cargar',
  wiz: { step: 1, examenId: null, tab: 'pend', q: '', alumnoId: null, notas: {}, editando: false },
  exq: '', alq: '', acq: '', verInactivos: false,
  rep: { tab: 'examen', examenId: null, alumnoId: null, etqExamen: '*' },
  form: null, panelSync: false
};
// cola de cambios: [{ opId, tipo, op, data, mod, desc }]
let queue = store.get(LSP + 'queue', []).map(j => j.opId ? j : {   // cola de v1.0.x (solo evaluaciones) → formato nuevo
  opId: uid('op'), tipo: 'evaluacion', op: 'upsert', data: j.data, mod: new Date(j.t || Date.now()).toISOString(), desc: 'Evaluación pendiente (v1.0)'
});
let syncErrors = store.get(LSP + 'syncErrors', []);
let lastSync = store.get(LSP + 'lastSync', null);
const SY = { flushing: false, pulling: false, inflight: 0, fallas: 0, lastError: '', timer: null, flushSeq: 0 };

function persist() {
  store.set(LSP + 'data', S.data); store.set(LSP + 'queue', queue);
  store.set(LSP + 'syncErrors', syncErrors); store.set(LSP + 'lastSync', lastSync);
}

const byApellido = (a, b) => (a.apellido + ' ' + a.nombre).localeCompare(b.apellido + ' ' + b.nombre, 'es');
const alumno = id => S.data.alumnos.find(a => a.id === id);
const examen = id => S.data.examenes.find(e => e.id === id);
const actividad = c => S.data.actividades.find(a => a.codigo === c);
const evalDe = (exId, alId) => S.data.evaluaciones.find(v => v.examenId === exId && v.alumnoId === alId);
const evalsDeExamen = exId => S.data.evaluaciones.filter(v => v.examenId === exId);
const fmtFecha = f => f && /^\d{4}-\d{2}-\d{2}/.test(f) ? f.slice(8, 10) + '/' + f.slice(5, 7) + '/' + f.slice(0, 4) : (f || '');
const pct = (a, b) => b ? Math.round(a * 100 / b) : 0;
const pctCls = p => p < 50 ? 'pct-lo' : p < 75 ? 'pct-mid' : 'pct-hi';
function conteo(notas, codigos) {
  const r = { C: 0, I: 0, N: 0, total: 0 };
  (codigos || Object.keys(notas)).forEach(c => { const v = notas[c]; if (r[v] != null) { r[v]++; r.total++; } });
  return r;
}
const normTags = s => [...new Set(String(s || '').split(',').map(x => x.trim().toLowerCase()).filter(Boolean))];

/* ---------------- Aplicar un cambio a los datos locales ---------------- */
function applyOp(D, o) {
  const d = o.data;
  if (o.tipo === 'alumno') {
    const a = D.alumnos.find(x => x.id === d.id);
    if (o.op === 'estado') { if (a) a.activo = d.activo; return; }
    if (a) { a.nombre = d.nombre; a.apellido = d.apellido; }
    else D.alumnos.push({ id: d.id, nombre: d.nombre, apellido: d.apellido, activo: true });
  } else if (o.tipo === 'actividad') {
    const a = D.actividades.find(x => x.codigo === d.codigo);
    if (o.op === 'estado') { if (a) a.activo = d.activo; return; }
    if (a) { a.descripcion = d.descripcion; a.etiquetas = d.etiquetas.slice(); }
    else D.actividades.push({ codigo: d.codigo, descripcion: d.descripcion, etiquetas: d.etiquetas.slice(), activo: true });
  } else if (o.tipo === 'examen') {
    const e = D.examenes.find(x => x.id === d.id);
    if (o.op === 'estado') { if (e) e.activo = d.activo; return; }
    if (e) {
      e.nombre = d.nombre; e.fecha = d.fecha;
      if (!D.evaluaciones.some(v => v.examenId === d.id)) e.codigos = d.codigos.slice();   // misma regla de bloqueo que el GAS
    } else D.examenes.push({ id: d.id, nombre: d.nombre, fecha: d.fecha, activo: true, codigos: d.codigos.slice() });
  } else if (o.tipo === 'evaluacion') {
    const v = D.evaluaciones.find(x => x.examenId === d.examenId && x.alumnoId === d.alumnoId);
    if (v) { v.notas = Object.assign({}, d.notas); v.fechaEdicion = o.mod; }
    else D.evaluaciones.push({ id: '', examenId: d.examenId, alumnoId: d.alumnoId, fechaCarga: o.mod, fechaEdicion: '', notas: Object.assign({}, d.notas) });
  }
}

/* ---------------- Cola: todo cambio se ve al instante y se sube después ---------------- */
const opKey = o => o.tipo + '|' + o.op + '|' + (o.tipo === 'evaluacion' ? o.data.examenId + '/' + o.data.alumnoId : (o.data.id || o.data.codigo));
function encolar(tipo, op, data, desc) {
  const o = { opId: uid('op'), tipo, op, data, mod: new Date().toISOString(), desc };
  applyOp(S.data, o);
  const k = opKey(o);
  const i = queue.findIndex((x, j) => j >= SY.inflight && opKey(x) === k);   // mismo cambio aún sin enviar → se reemplaza
  if (i >= 0) queue[i] = o; else queue.push(o);
  persist(); render(); updSync();
  scheduleFlush(300);
}
function encolarEval(d) {
  const al = alumno(d.alumnoId), ex = examen(d.examenId);
  encolar('evaluacion', 'upsert', d, 'Evaluación: ' + al.apellido + ', ' + al.nombre + ' – ' + ex.nombre);
}
function scheduleFlush(ms) { clearTimeout(SY.timer); SY.timer = setTimeout(flush, ms); }

async function flush() {
  const ses = getSession();
  if (SY.flushing || !queue.length || !ses) { updSync(); return; }
  SY.flushing = true; SY.inflight = queue.length; updSync();
  const ops = queue.slice(0, SY.inflight).map(o => ({ opId: o.opId, tipo: o.tipo, op: o.op, data: o.data, mod: o.mod }));
  let ok = false, rechazos = 0;
  try {
    const r = await http('POST', { action: 'batch', email: ses.email, token: ses.token, ops });
    if (esRevocada(r)) { SY.flushing = false; SY.inflight = 0; revocar(); return; }
    if (!r.ok) throw netError(r.error || 'Error del servidor');
    const enviados = queue.splice(0, ops.length);
    (r.resultados || []).forEach(x => {
      if (x.ok) return;
      const o = enviados.find(e => e.opId === x.opId);
      syncErrors.unshift({ t: new Date().toISOString(), desc: o ? o.desc : x.opId, error: x.error || 'Rechazado' });
      rechazos++;
    });
    syncErrors = syncErrors.slice(0, 30);
    SY.fallas = 0; SY.lastError = ''; SY.flushSeq++; lastSync = new Date().toISOString(); ok = true;
  } catch (e) {
    SY.fallas++; SY.lastError = e.message || 'Sin conexión';
  } finally {
    SY.flushing = false; SY.inflight = 0; persist(); updSync();
  }
  if (ok) {
    if (rechazos) { toast(rechazos + ' cambio(s) rechazado(s) por el servidor. Tocá el indicador de sincronización para ver el detalle.', 'error'); pull(); }
    if (queue.length) scheduleFlush(500);
  } else scheduleFlush(RETRY_MS[Math.min(SY.fallas - 1, RETRY_MS.length - 1)]);
}

async function pull(manual) {
  const ses = getSession();
  if (!ses || SY.pulling) return false;
  SY.pulling = true; updSync();
  const seq = SY.flushSeq;
  let ok = false;
  try {
    const r = await http('GET', { action: 'sync', email: ses.email, token: ses.token });
    if (esRevocada(r)) { SY.pulling = false; revocar(); return false; }
    if (!r.ok) throw netError(r.error || 'Error del servidor');
    const D = { alumnos: r.alumnos || [], actividades: r.actividades || [], examenes: r.examenes || [], evaluaciones: r.evaluaciones || [] };
    queue.forEach(o => applyOp(D, o));               // lo pendiente del dispositivo manda sobre lo del Sheet
    S.data = D; lastSync = new Date().toISOString(); SY.lastError = ''; SY.fallas = 0;
    persist(); ok = true;
    if (appVisible()) renderSafe();
  } catch (e) {
    SY.lastError = e.message || 'Sin conexión';
    if (manual) toast('No se pudo actualizar: ' + SY.lastError, 'error');
  } finally { SY.pulling = false; updSync(); }
  if (ok && seq !== SY.flushSeq) setTimeout(() => pull(), 400);   // se subió un lote mientras leía → releer
  return ok;
}

/* ---------------- Indicador (círculo de 4 estados) + panel ---------------- */
function syncEstado() {
  const n = queue.length;
  if (navigator.onLine === false) return { cls: 'off', txt: 'Sin red' + (n ? ' · ' + n : ''), largo: 'Sin red: se trabaja con la copia del dispositivo' };
  if (SY.flushing) return { cls: 'saving', txt: 'Enviando ' + SY.inflight, largo: 'Subiendo cambios al Sheet' };
  if (n) return { cls: 'pending', txt: n + ' pendiente' + (n > 1 ? 's' : ''), largo: 'Hay cambios sin subir (se reintenta solo)' };
  if (SY.pulling) return { cls: 'saving', txt: 'Actualizando…', largo: 'Leyendo los datos del Sheet' };
  if (SY.lastError) return { cls: 'pending', txt: 'Sin servidor', largo: 'No se pudo conectar con el servidor (' + SY.lastError + ')' };
  if (syncErrors.length) return { cls: 'pending', txt: 'Revisar', largo: 'Sincronizado, con cambios rechazados para revisar' };
  return { cls: 'ok', txt: lastSync ? '✓ ' + hhmm(lastSync) : '✓', largo: 'Todo sincronizado' };
}
function updSync() {
  const el = $('#sync'); if (!el) return;
  const e = syncEstado();
  el.className = 'sync ' + e.cls;
  $('#syncTxt').textContent = e.txt;
  el.title = e.largo + ' — tocá para ver el detalle';
  if (S.panelSync) { const p = $('#panelSyncBody'); if (p) p.innerHTML = panelSyncBody(); }
}
function panelSyncBody() {
  const e = syncEstado();
  let h = '<div class="card" style="margin-bottom:12px">' +
    '<div class="kv"><span>Estado</span><b><span class="dotg2 ' + e.cls + '"></span>' + esc(e.largo) + '</b></div>' +
    '<div class="kv"><span>Pendientes</span><b>' + queue.length + '</b></div>' +
    '<div class="kv"><span>Última sincronización</span><b>' + (lastSync ? fechaHora(lastSync) : '—') + '</b></div>' +
    '<div class="kv"><span>Conexión</span><b>' + (navigator.onLine === false ? 'sin red' : 'con red') + '</b></div>' +
    (SY.lastError ? '<div class="kv"><span>Último error</span><b class="pct-lo">' + esc(SY.lastError) + '</b></div>' : '') + '</div>';
  if (queue.length) {
    h += '<div class="small muted" style="font-weight:700;margin:0 2px 6px">PENDIENTES DE SUBIR</div><div class="card" style="margin-bottom:12px">' +
      queue.slice(0, 50).map((o, i) => '<div class="kv"><span>' + esc(o.desc || o.tipo) + '</span><b class="small muted">' + hhmm(o.mod) + '</b></div>').join('') +
      (queue.length > 50 ? '<div class="kv"><span>… y ' + (queue.length - 50) + ' más</span></div>' : '') + '</div>';
  }
  if (syncErrors.length) {
    h += '<div class="row" style="justify-content:space-between;margin:0 2px 6px"><span class="small muted" style="font-weight:700">RECHAZADOS POR EL SERVIDOR</span><button class="btn sm" data-act="syncClear">Descartar</button></div>' +
      '<div class="card" style="margin-bottom:12px">' + syncErrors.map(x => '<div class="kv col"><span>' + esc(x.desc) + ' · ' + fechaHora(x.t) + '</span><b class="pct-lo small">' + esc(x.error) + '</b></div>').join('') + '</div>';
  }
  return h;
}
function abrirPanelSync() {
  openModal('<h2>Sincronización</h2><div id="panelSyncBody">' + panelSyncBody() + '</div>' +
    '<p class="small muted">Los cambios se guardan primero en este dispositivo y se suben solos. Si no hay red, se suben cuando vuelve.</p>' +
    '<div class="acts"><button class="btn" data-act="closeModal">Cerrar</button><button class="btn primary" data-act="syncNow">' + ic('sync') + 'Sincronizar ahora</button></div>');
  S.panelSync = true;
}
async function syncNow(btn) {
  setBusy(btn, true);
  SY.fallas = 0; clearTimeout(SY.timer);
  await flush();
  await pull(true);
  setBusy(btn, false);
}

function revocar() {
  ['session', 'data', 'queue', 'syncErrors', 'lastSync'].forEach(k => store.del(LSP + k));
  queue = []; syncErrors = []; lastSync = null; S.data = vacio();
  closeModal();
  showLogin('La sesión de este dispositivo fue cerrada desde el Sheet. Ingresá de nuevo.');
}

window.addEventListener('online', () => { SY.fallas = 0; updSync(); flush(); pull(); });

setInterval(() => { if (queue.length && !SY.flushing && getSession()) flush(); updSync(); }, 30000);
setInterval(() => { if (!document.hidden && getSession() && appVisible() && !queue.length) pull(); }, 120000);

function showPin(email, msg) {
  showScreen('<div class="card login">' + logoBlock() +
    '<p class="center small muted">Te mandamos un código de 6 dígitos a<br><b>' + esc(email) + '</b></p>' +
    '<form id="fPin"><div class="field"><input class="input pin-input" id="lPin" inputmode="numeric" autocomplete="one-time-code" maxlength="6" pattern="\\d{6}" required></div>' +
    '<button class="btn primary block big" id="bPin">Ingresar</button><div class="err" id="lErr">' + esc(msg || '') + '</div></form>' +
    '<div class="row" style="justify-content:space-between;margin-top:10px"><button class="btn sm" id="bOtro">Cambiar mail</button><button class="btn sm" id="bReenv">Reenviar código</button></div></div>');
  $('#lPin').focus();
  $('#bOtro').onclick = () => showLogin('', email);
  $('#bReenv').onclick = async () => {
    try { const r = await http('GET', { action: 'solicitarPIN', email }); $('#lErr').textContent = r.ok ? 'Código reenviado.' : motivoTxt(r); }
    catch (e) { $('#lErr').textContent = 'No se pudo conectar. Probá de nuevo.'; }
  };
  $('#fPin').addEventListener('submit', async e => {
    e.preventDefault();
    const b = $('#bPin'); setBusy(b, true); $('#lErr').textContent = '';
    try {
      const r = await http('POST', { action: 'validarPIN', email, pin: $('#lPin').value.trim(), dispositivo: dispositivoTxt() });
      if (r.ok) {
        if (store.get(LSP + 'owner', '') !== email) {           // otra cuenta en este dispositivo → copia local limpia
          ['data', 'queue', 'syncErrors', 'lastSync'].forEach(k => store.del(LSP + k));
          queue = []; syncErrors = []; lastSync = null; S.data = vacio();
        }
        store.set(LSP + 'owner', email);
        store.set(LSP + 'session', { email, token: r.token });
        await boot();
        return;
      }
      if (r.motivo === 'bloqueado_ahora') { showLogin(motivoTxt(r), email); return; }
      $('#lErr').textContent = motivoTxt(r);
    } catch (err) { $('#lErr').textContent = 'No se pudo conectar (' + err.message + '). Probá de nuevo.'; }
    setBusy(b, false);
  });
}
function showSplash(txt) { showScreen('<div class="center"><div class="spinner"></div><div class="muted">' + esc(txt) + '</div></div>'); }
function showOffline() {
  showScreen('<div class="card login center">' + logoBlock() + '<p>No se pudo conectar con el servidor y este dispositivo todavía no tiene datos guardados.</p>' +
    '<p class="muted small">Tu sesión sigue guardada. Revisá internet y reintentá.</p><button class="btn primary block big" id="bRetry">Reintentar</button></div>');
  $('#bRetry').onclick = boot;
}
function logout() {
  ['session', 'data', 'queue', 'syncErrors', 'lastSync'].forEach(k => store.del(LSP + k));
  queue = []; syncErrors = []; lastSync = null; S.data = vacio();
  closeModal();
  showLogin('Sesión cerrada. Los datos de este dispositivo se borraron (en el Sheet siguen todos).');
}
function mostrarApp() {
  $('#screen').classList.add('hidden');
  $('#app').classList.remove('hidden');
  render(); updSync();
}

async function boot() {
  applyTheme();
  const ses = getSession();
  if (!ses || !ses.token) { showLogin(); return; }
  if (store.get(LSP + 'data', null)) {          // hay copia local → abre al instante y sincroniza detrás
    mostrarApp();
    flush(); pull();
    return;
  }
  showSplash('Cargando datos…');                // primer ingreso en este dispositivo
  const ok = await pull();
  if (!getSession()) return;                     // la sesión fue revocada durante la lectura
  if (ok) { mostrarApp(); flush(); } else showOffline();
}

/* =====================================================================
   Navegación (menú lateral colapsable en desktop)
   ===================================================================== */
const VIEWS = [
  { id: 'cargar', label: 'Cargar', ic: 'cargar' },
  { id: 'examenes', label: 'Exámenes', ic: 'examen' },
  { id: 'alumnos', label: 'Alumnos', ic: 'alumnos' },
  { id: 'actividades', label: 'Actividades', ic: 'actividades' },
  { id: 'reportes', label: 'Reportes', ic: 'reportes' }
];
function renderNav() {
  const col = document.body.classList.contains('nav-col');
  $('#nav').innerHTML = VIEWS.map(v => '<button data-act="nav" data-v="' + v.id + '" title="' + v.label + '" class="' + (S.view === v.id ? 'on' : '') + '">' + ic(v.ic) + '<span>' + v.label + '</span></button>').join('') +
    '<button class="nav-toggle" data-act="navToggle" title="' + (col ? 'Expandir menú' : 'Colapsar menú') + '">' + ic(col ? 'colR' : 'colL') + '<span>Colapsar</span></button>';
}
function toggleNav() {
  const c = !document.body.classList.contains('nav-col');
  document.body.classList.toggle('nav-col', c);
  store.set('navCol', c);
  renderNav();
}
function go(view) { S.view = view; render(); window.scrollTo(0, 0); }
function render() {
  renderNav();
  const fn = { cargar: viewCargar, examenes: viewExamenes, alumnos: viewAlumnos, actividades: viewActividades, reportes: viewReportes }[S.view];
  $('#main').innerHTML = fn();
}
// re-render tras una sincronización en segundo plano, sin interrumpir si se está escribiendo
function renderSafe() {
  const a = document.activeElement;
  if (a && a.closest && a.closest('#main') && /INPUT|SELECT|TEXTAREA/.test(a.tagName)) return;
  render();
}

/* =====================================================================
   CARGAR — wizard de 4 pasos
   ===================================================================== */
function stepsBar(n) { return '<div class="steps">' + [1, 2, 3, 4].map(i => '<div class="' + (i <= n ? 'on' : '') + '"></div>').join('') + '</div>'; }
function wzHead(back, step, t, s) {
  return '<div class="wz-head">' + (back ? '<button class="back" data-act="wzBack" aria-label="Volver">' + ic('back') + '</button>' : '') +
    '<div class="grow"><div class="stepname">' + step + '</div><div class="t">' + esc(t) + '</div>' + (s ? '<div class="s">' + esc(s) + '</div>' : '') + '</div></div>';
}
function viewCargar() {
  const w = S.wiz;
  if (w.step > 1 && !examen(w.examenId)) w.step = 1;
  return '<div class="wrap">' + stepsBar(w.step) + [null, wz1, wz2, wz3, wz4][w.step]() + '</div>';
}
function wz1() {
  const exs = S.data.examenes.filter(e => e.activo).sort((a, b) => b.fecha.localeCompare(a.fecha));
  const nAl = S.data.alumnos.filter(a => a.activo).length;
  let h = wzHead(false, 'Paso 1 de 4', 'Elegí el examen');
  if (!exs.length) return h + '<div class="card empty">No hay exámenes activos.<br><br><button class="btn primary" data-act="nav" data-v="examenes">Crear un examen</button></div>';
  h += '<div class="list">' + exs.map(e => {
    const n = evalsDeExamen(e.id).filter(v => (alumno(v.alumnoId) || {}).activo).length;
    return '<button class="item" data-act="wzExamen" data-id="' + e.id + '"><div class="grow"><div class="t">' + esc(e.nombre) + '</div>' +
      '<div class="s">' + fmtFecha(e.fecha) + ' · ' + e.codigos.length + ' actividades · ' + n + '/' + nAl + ' rendidos</div>' +
      '<div class="bar" style="margin-top:8px"><span style="width:' + pct(n, nAl) + '%"></span></div></div>' + ic('chev').replace('<svg', '<svg class="chev"') + '</button>';
  }).join('') + '</div>';
  return h;
}
function wz2() {
  const w = S.wiz, ex = examen(w.examenId);
  const activos = S.data.alumnos.filter(a => a.activo).sort(byApellido);
  const rend = activos.filter(a => evalDe(ex.id, a.id));
  const pend = activos.filter(a => !evalDe(ex.id, a.id));
  const q = w.q.trim().toLowerCase();
  const lista = (w.tab === 'pend' ? pend : rend).filter(a => !q || (a.apellido + ' ' + a.nombre).toLowerCase().includes(q));
  let h = wzHead(true, 'Paso 2 de 4', 'Elegí el alumno', ex.nombre);
  h += '<div class="seg" style="margin-bottom:10px"><button data-act="wzTab" data-v="pend" class="' + (w.tab === 'pend' ? 'on' : '') + '">Pendientes (' + pend.length + ')</button>' +
    '<button data-act="wzTab" data-v="rend" class="' + (w.tab === 'rend' ? 'on' : '') + '">Rendidos (' + rend.length + ')</button></div>';
  h += '<div class="search" style="margin-bottom:10px">' + ic('search') + '<input class="input" id="wzQ" placeholder="Buscar alumno…" value="' + esc(w.q) + '" data-inp="wzQ"></div>';
  if (!lista.length) return h + '<div class="card empty">' + (q ? 'Sin resultados.' : w.tab === 'pend' ? '¡Todos rindieron este examen! 🎉' : 'Todavía nadie rindió este examen.') + '</div>';
  h += '<div class="list" id="wzList">' + lista.map(a => {

function wz3() {

function wz4() {
  const w = S.wiz, ex = examen(w.examenId), al = alumno(w.alumnoId);

  let h = wzHead(true, 'Paso 4 de 4', 'Confirmá la evaluación', al.apellido + ', ' + al.nombre + ' · ' + ex.nombre);
  h += '<div class="sum3">' + ['C', 'I', 'N'].map(k => '<div class="card"><div class="v" style="color:var(--' + { C: 'ok', I: 'bad', N: 'nr' }[k] + ')">' + c[k] + '</div><div class="l">' + ESTADOS[k].label + '</div><div class="p">' + pct(c[k], c.total) + '%</div></div>').join('') + '</div>';

    return '<div class="row" style="padding:10px 14px;' + (i ? 'border-top:1px solid var(--border)' : '') + '"><span class="dotg ' + w.notas[cod] + '"></span><div class="grow"><b class="small">' + esc(cod) + '</b> <span class="small">' + esc(a.descripcion) + '</span></div><span class="chip ' + w.notas[cod].toLowerCase() + '">' + ESTADOS[w.notas[cod]].label + '</span></div>';

function wzGrade(btn) {
  const w = S.wiz, c = btn.dataset.c, v = btn.dataset.v;
  w.notas[c] = v;
  const row = document.getElementById('row-' + c);
  row.className = 'act-row ' + v;
  row.querySelectorAll('.g').forEach(b => { const on = b.dataset.v === v; b.classList.toggle('sel', on); b.setAttribute('aria-pressed', on); });
  const ex = examen(w.examenId), hechas = ex.codigos.filter(k => w.notas[k]).length;
  $('#wzProg').style.width = pct(hechas, ex.codigos.length) + '%';
  $('#wzProgTxt').textContent = hechas + ' de ' + ex.codigos.length + ' calificadas';
}
function wzRevisar() {
  const w = S.wiz, ex = examen(w.examenId);
  const falta = ex.codigos.find(c => !w.notas[c]);
  if (falta) {
    const row = document.getElementById('row-' + falta);
    row.scrollIntoView({ behavior: 'smooth', block: 'center' });
    row.classList.remove('flash'); void row.offsetWidth; row.classList.add('flash');
    toast('Falta calificar ' + falta);
    return;
  }
  w.step = 4; render(); window.scrollTo(0, 0);
}
function wzConfirmar() {
  const w = S.wiz, ex = examen(w.examenId), al = alumno(w.alumnoId);
  const notas = {}; ex.codigos.forEach(c => notas[c] = w.notas[c]);
  encolarEval({ examenId: ex.id, alumnoId: al.id, notas });
  toast((w.editando ? 'Actualizado: ' : 'Guardado: ') + al.apellido + ', ' + al.nombre);
  w.tab = w.editando ? 'rend' : 'pend';
  w.step = 2; w.alumnoId = null; w.notas = {}; w.editando = false; w.q = '';
  render(); window.scrollTo(0, 0);

  h += toolbarHtml('exq', S.exq, 'Buscar examen…', 'nuevoExamen', 'Nuevo examen');
  if (!exs.length) return h + '<div class="card empty">No hay exámenes.</div></div>';
  h += '<div class="list">' + exs.map(e => {
    const n = evalsDeExamen(e.id).length;
    return '<div class="item"><div class="grow"><div class="t">' + esc(e.nombre) + (e.activo ? '' : ' <span class="chip off">inactivo</span>') + '</div>' +
      '<div class="s">' + fmtFecha(e.fecha) + ' · ' + e.codigos.length + ' actividades · ' + n + ' evaluados' + (n ? ' · 🔒 actividades bloqueadas' : '') + '</div></div>' +
      '<div class="row wrapr" style="justify-content:flex-end"><button class="btn sm" data-act="editExamen" data-id="' + e.id + '">' + ic('edit') + 'Editar</button>' +
      '<button class="btn sm" data-act="dupExamen" data-id="' + e.id + '">' + ic('copy') + 'Duplicar</button>' +
      '<button class="btn sm ' + (e.activo ? 'danger' : '') + '" data-act="toggleExamen" data-id="' + e.id + '">' + (e.activo ? 'Dar de baja' : 'Reactivar') + '</button></div></div>';
  }).join('') + '</div></div>';

function toolbarHtml(key, val, ph, act, label) {
  return '<div class="toolbar"><div class="search grow" style="min-width:200px">' + ic('search') + '<input class="input" placeholder="' + ph + '" value="' + esc(val) + '" data-inp="' + key + '"></div>' +
    '<label class="row small muted" style="gap:6px"><input type="checkbox" data-act="verInactivos" ' + (S.verInactivos ? 'checked' : '') + '> Ver inactivos</label>' +
    '<button class="btn primary" data-act="' + act + '">' + ic('plus') + label + '</button></div>';
}
function abrirFormExamen(id, duplicar) {
  const e = id ? examen(id) : null;
  S.form = {
    tipo: 'examen', id: (e && !duplicar) ? e.id : '', nombre: e ? (duplicar ? e.nombre + ' (copia)' : e.nombre) : '',
    fecha: e && !duplicar ? e.fecha : new Date().toISOString().slice(0, 10), codigos: e ? e.codigos.slice() : [],
    q: '', tag: '', locked: !!(e && !duplicar && evalsDeExamen(e.id).length), err: ''
  };
  renderFormExamen();
}
function renderFormExamen() {
  const f = S.form;
  const tags = [...new Set(S.data.actividades.filter(a => a.activo).flatMap(a => a.etiquetas))].sort((a, b) => a.localeCompare(b, 'es'));

  const n = f.codigos.length;

  h += '<div class="field" style="max-width:220px"><label>Fecha</label><input class="input" type="date" data-fi="fecha" value="' + esc(f.fecha) + '"></div>';

  }
  h += '<div class="col"><div class="small muted" style="font-weight:700;margin:2px 4px 8px">EN EL EXAMEN (' + n + ')' + aviso + '</div>' +

      const a = actividad(c) || {};
      return '<div class="pk"><span class="act-num" style="font-size:1.1rem">' + (i + 1) + '</span><div class="grow"><div class="c">' + esc(c) + '</div><div class="d">' + esc(a.descripcion) + '</div></div>' +
        (f.locked ? '' : '<button class="mini-btn" data-act="fUp" data-i="' + i + '" ' + (i ? '' : 'disabled') + ' title="Subir">' + ic('up') + '</button><button class="mini-btn" data-act="fDown" data-i="' + i + '" ' + (i < n - 1 ? '' : 'disabled') + ' title="Bajar">' + ic('down') + '</button><button class="mini-btn" data-act="fDel" data-i="' + i + '" title="Quitar">' + ic('x') + '</button>') + '</div>';
    }).join('') : '<div class="empty small">Agregá actividades desde el catálogo.</div>') + '</div></div>';
  h += '<div class="err">' + esc(f.err) + '</div><div class="acts"><button class="btn" data-act="closeModal">Cancelar</button><button class="btn primary" data-act="saveExamen">Guardar examen</button></div>';
  const st = document.querySelector('.modal'); const scr = st ? st.scrollTop : 0;

  openModal(h, true);

  if (foc === 'q') { const el = document.querySelector('[data-fi="q"]'); el.focus(); el.setSelectionRange(el.value.length, el.value.length); }
}
function saveExamen() {
  const f = S.form;
  if (!f.nombre.trim()) { f.err = 'Poné un nombre.'; renderFormExamen(); return; }
  if (!/^\d{4}-\d{2}-\d{2}$/.test(f.fecha)) { f.err = 'Fecha inválida.'; renderFormExamen(); return; }
  if (!f.codigos.length) { f.err = 'Agregá al menos una actividad.'; renderFormExamen(); return; }
  if (f.id && evalsDeExamen(f.id).length && examen(f.id).codigos.join('|') !== f.codigos.join('|')) {
    f.err = 'Las actividades están bloqueadas: ya hay alumnos evaluados.'; renderFormExamen(); return;
  }
  const data = { id: f.id || uid('E'), nombre: f.nombre.trim(), fecha: f.fecha, codigos: f.codigos.slice() };
  const desc = (f.id ? 'Edición' : 'Alta') + ' examen: ' + data.nombre;
  closeModal();
  encolar('examen', 'upsert', data, desc);
  toast('Examen guardado');
}

  let h = '<div class="wrap wide"><h1 class="title">Alumnos</h1><p class="subtitle">' + S.data.alumnos.filter(a => a.activo).length + ' activos. Para carga masiva usá el menú del Sheet: <b>' + esc(CONFIG.APP_NAME) + ' Admin › Importar alumnos</b> (aparecen con la próxima sincronización).</p>';
  h += toolbarHtml('alq', S.alq, 'Buscar alumno…', 'nuevoAlumno', 'Nuevo alumno');

function toggleEstado(tipo, key) {
  const o = tipo === 'alumno' ? alumno(key) : tipo === 'actividad' ? actividad(key) : examen(key);
  if (!o) return;
  if (o.activo && !confirm('¿Dar de baja? No se borra nada: deja de aparecer para cargar y se puede reactivar.')) return;
  const data = tipo === 'actividad' ? { codigo: o.codigo, activo: !o.activo } : { id: o.id, activo: !o.activo };
  const nombre = tipo === 'alumno' ? o.apellido + ', ' + o.nombre : tipo === 'actividad' ? o.codigo : o.nombre;
  encolar(tipo, 'estado', data, (o.activo ? 'Baja ' : 'Reactivación ') + tipo + ': ' + nombre);

function repExamen() {
  const exs = S.data.examenes.slice().sort((a, b) => b.fecha.localeCompare(a.fecha));
  if (!exs.length) return '<div class="card empty">No hay exámenes.</div>';
  if (!examen(S.rep.examenId)) S.rep.examenId = (exs.find(e => evalsDeExamen(e.id).length) || exs[0]).id;
  const ex = examen(S.rep.examenId);
  let h = '<div class="toolbar">' + selectHtml('repExamen', exs.map(e => [e.id, e.nombre + ' · ' + fmtFecha(e.fecha)]), ex.id) + '</div>';
  const evs = evalsDeExamen(ex.id).map(v => ({ v, a: alumno(v.alumnoId) })).filter(x => x.a).sort((x, y) => byApellido(x.a, y.a));
  const activos = S.data.alumnos.filter(a => a.activo).length;
  if (!evs.length) return h + '<div class="card empty">Nadie rindió todavía este examen.</div>';
  const porAct = ex.codigos.map(c => { const k = { C: 0, I: 0, N: 0 }; evs.forEach(x => { const n = x.v.notas[c]; if (k[n] != null) k[n]++; }); return { c, k, p: pct(k.C, evs.length) }; });
  const tot = evs.reduce((s, x) => s + conteo(x.v.notas, ex.codigos).C, 0);
  const prom = pct(tot, evs.length * ex.codigos.length);
  const peor = porAct.slice().sort((a, b) => a.p - b.p)[0];
  h += '<div class="kpis"><div class="card kpi"><div class="v">' + evs.length + '/' + activos + '</div><div class="l">rindieron</div></div>' +
    '<div class="card kpi"><div class="v ' + pctCls(prom) + '">' + prom + '%</div><div class="l">correctas del grupo</div></div>' +
    '<div class="card kpi"><div class="v">' + esc(peor.c) + '</div><div class="l">la que más costó (' + peor.p + '% correctas)</div></div></div>';
  h += '<div class="tbl-wrap"><table class="tbl"><thead><tr><th class="stick">Alumno</th>' + ex.codigos.map(c => '<th class="ctr" title="' + esc((actividad(c) || {}).descripcion) + '">' + esc(c) + '</th>').join('') + '<th class="ctr">% ✓</th></tr></thead><tbody>' +
    evs.map(x => {
      const k = conteo(x.v.notas, ex.codigos), p = pct(k.C, ex.codigos.length);
      return '<tr><td class="stick"><b>' + esc(x.a.apellido) + '</b>, ' + esc(x.a.nombre) + '</td>' + ex.codigos.map(c => { const n = x.v.notas[c]; return '<td class="ctr"><span class="cell ' + (n || 'x') + '">' + ({ C: '✓', I: '✗', N: '–' }[n] || '·') + '</span></td>'; }).join('') +
        '<td class="ctr"><b class="' + pctCls(p) + '">' + p + '%</b></td></tr>';
    }).join('') + '</tbody><tfoot><tr><td class="stick">% correctas</td>' + porAct.map(x => '<td class="ctr ' + pctCls(x.p) + '">' + x.p + '%</td>').join('') + '<td class="ctr ' + pctCls(prom) + '">' + prom + '%</td></tr></tfoot></table></div>' + legend;
  return h;
}
function repAlumno() {
  const als = S.data.alumnos.slice().sort(byApellido);
  if (!als.length) return '<div class="card empty">No hay alumnos.</div>';
  if (!alumno(S.rep.alumnoId)) S.rep.alumnoId = als[0].id;
  const al = alumno(S.rep.alumnoId);
  let h = '<div class="toolbar">' + selectHtml('repAlumno', als.map(a => [a.id, a.apellido + ', ' + a.nombre + (a.activo ? '' : ' (inactivo)')]), al.id) + '</div>';
  const evs = S.data.evaluaciones.filter(v => v.alumnoId === al.id).map(v => ({ v, e: examen(v.examenId) })).filter(x => x.e).sort((a, b) => a.e.fecha.localeCompare(b.e.fecha));
  if (!evs.length) return h + '<div class="card empty">Todavía no rindió ningún examen.</div>';
  h += '<div class="tbl-wrap" style="margin-bottom:16px"><table class="tbl"><thead><tr><th>Examen</th><th>Fecha</th><th class="ctr">✓</th><th class="ctr">✗</th><th class="ctr">–</th><th style="min-width:160px">Distribución</th><th class="ctr">% ✓</th></tr></thead><tbody>' +
    evs.map(x => { const k = conteo(x.v.notas, x.e.codigos), p = pct(k.C, k.total); return '<tr><td>' + esc(x.e.nombre) + '</td><td>' + fmtFecha(x.e.fecha) + '</td><td class="ctr">' + k.C + '</td><td class="ctr">' + k.I + '</td><td class="ctr">' + k.N + '</td><td>' + stackBar(k) + '</td><td class="ctr"><b class="' + pctCls(p) + '">' + p + '%</b></td></tr>'; }).join('') +
    '</tbody></table></div>';
  const tags = agruparEtiquetas(evs.map(x => ({ notas: x.v.notas, codigos: x.e.codigos })));
  h += '<div class="small muted" style="font-weight:700;margin:0 2px 8px">POR ETIQUETA (todos sus exámenes)</div>' + tablaEtiquetas(tags);
  return h;
}
function repEtiqueta() {
  const exs = S.data.examenes.slice().sort((a, b) => b.fecha.localeCompare(a.fecha));
  let h = '<div class="toolbar">' + selectHtml('repEtqExamen', exs.map(e => [e.id, e.nombre + ' · ' + fmtFecha(e.fecha)]), S.rep.etqExamen, '<option value="*"' + (S.rep.etqExamen === '*' ? ' selected' : '') + '>Todos los exámenes</option>') + '</div>';
  const evs = S.data.evaluaciones.filter(v => S.rep.etqExamen === '*' || v.examenId === S.rep.etqExamen).map(v => ({ notas: v.notas, codigos: (examen(v.examenId) || { codigos: [] }).codigos }));
  if (!evs.length) return h + '<div class="card empty">Sin evaluaciones para analizar.</div>';
  return h + tablaEtiquetas(agruparEtiquetas(evs)) + '<p class="small muted">Ordenado de menor a mayor % de correctas: arriba, lo que más cuesta.</p>';
}
function agruparEtiquetas(lista) {
  const t = {};
  lista.forEach(x => x.codigos.forEach(c => {
    const n = x.notas[c]; if (!n) return;
    const a = actividad(c); const etqs = a && a.etiquetas.length ? a.etiquetas : ['(sin etiqueta)'];
    etqs.forEach(e => { const k = t[e] = t[e] || { C: 0, I: 0, N: 0, total: 0, acts: new Set() }; k[n]++; k.total++; k.acts.add(c); });
  }));
  return Object.keys(t).map(e => Object.assign({ etiqueta: e, p: pct(t[e].C, t[e].total) }, t[e])).sort((a, b) => a.p - b.p || a.etiqueta.localeCompare(b.etiqueta));
}
function stackBar(k) { return '<div class="stack"><span class="c" style="width:' + pct(k.C, k.total) + '%"></span><span class="i" style="width:' + pct(k.I, k.total) + '%"></span><span class="n" style="width:' + pct(k.N, k.total) + '%"></span></div>'; }
function tablaEtiquetas(tags) {
  if (!tags.length) return '<div class="card empty">Sin datos.</div>';
  return '<div class="tbl-wrap"><table class="tbl"><thead><tr><th>Etiqueta</th><th class="ctr">Actividades</th><th class="ctr">Respuestas</th><th style="min-width:180px">✓ / ✗ / –</th><th class="ctr">% ✓</th></tr></thead><tbody>' +
    tags.map(t => '<tr><td><span class="chip acc">' + esc(t.etiqueta) + '</span></td><td class="ctr">' + t.acts.size + '</td><td class="ctr">' + t.total + '</td><td>' + stackBar(t) + '</td><td class="ctr"><b class="' + pctCls(t.p) + '">' + t.p + '%</b></td></tr>').join('') +
    '</tbody></table></div>';
}

document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b) return;
  const act = b.dataset.act, w = S.wiz, f = S.form;
  switch (act) {
    case 'nav': closeModal(); go(b.dataset.v); break;
    case 'wzExamen': w.examenId = b.dataset.id; w.step = 2; w.tab = 'pend'; w.q = ''; render(); window.scrollTo(0, 0); break;
    case 'wzTab': w.tab = b.dataset.v; render(); break;
    case 'wzAlumno': {
      w.alumnoId = b.dataset.id;
      const ev = evalDe(w.examenId, w.alumnoId);
      w.editando = !!ev; w.notas = ev ? Object.assign({}, ev.notas) : {};
      w.step = 3; render(); window.scrollTo(0, 0); break;
    }
    case 'wzBack': w.step = Math.max(1, w.step - 1); if (w.step < 3) { w.notas = {}; w.editando = false; } render(); window.scrollTo(0, 0); break;
    case 'grade': wzGrade(b); break;
    case 'wzRevisar': wzRevisar(); break;
    case 'wzConfirmar': wzConfirmar(); break;
    case 'closeModal': closeModal(); break;
    case 'navToggle': toggleNav(); break;
    case 'syncNow': syncNow(b); break;
    case 'syncClear': syncErrors = []; persist(); updSync(); break;
    case 'verInactivos': S.verInactivos = b.checked; render(); break;
    case 'nuevoExamen': abrirFormExamen(null); break;
    case 'editExamen': abrirFormExamen(b.dataset.id); break;
    case 'dupExamen': abrirFormExamen(b.dataset.id, true); break;
    case 'toggleExamen': toggleEstado('examen', b.dataset.id, b); break;
    case 'fTag': f.tag = b.dataset.v; renderFormExamen(); break;
    case 'fAdd': f.codigos.push(b.dataset.c); f.err = ''; renderFormExamen(); break;
    case 'fDel': f.codigos.splice(+b.dataset.i, 1); renderFormExamen(); break;
    case 'fUp': { const i = +b.dataset.i; [f.codigos[i - 1], f.codigos[i]] = [f.codigos[i], f.codigos[i - 1]]; renderFormExamen(); break; }
    case 'fDown': { const i = +b.dataset.i; [f.codigos[i + 1], f.codigos[i]] = [f.codigos[i], f.codigos[i + 1]]; renderFormExamen(); break; }
    case 'saveExamen': saveExamen(b); break;
    case 'nuevoAlumno': abrirFormAlumno(null); break;
    case 'editAlumno': abrirFormAlumno(b.dataset.id); break;
    case 'toggleAlumno': toggleEstado('alumno', b.dataset.id, b); break;
    case 'nuevaActividad': abrirFormActividad(null); break;
    case 'editActividad': abrirFormActividad(b.dataset.c); break;
    case 'toggleActividad': toggleEstado('actividad', b.dataset.c, b); break;
    case 'addTag': { const el = $('#acE'); const cur = el.value.split(',').map(x => x.trim()).filter(Boolean); if (!cur.includes(b.dataset.v)) cur.push(b.dataset.v); el.value = cur.join(', '); break; }
    case 'repTab': S.rep.tab = b.dataset.v; render(); break;
  }
});
document.addEventListener('input', e => {
  const el = e.target;
  if (el.dataset.inp) {
    const k = el.dataset.inp;
    if (k === 'wzQ') S.wiz.q = el.value; else S[k] = el.value;
    const pos = el.selectionStart; render();
    const n = document.querySelector('[data-inp="' + k + '"]'); if (n) { n.focus(); n.setSelectionRange(pos, pos); }
  } else if (el.dataset.fi && S.form) {
    S.form[el.dataset.fi] = el.value;
    if (el.dataset.fi === 'q') renderFormExamen();
  }
});
document.addEventListener('change', e => {
  const el = e.target;
  if (el.dataset.sel === 'repExamen') S.rep.examenId = el.value;
  else if (el.dataset.sel === 'repAlumno') S.rep.alumnoId = el.value;
  else if (el.dataset.sel === 'repEtqExamen') S.rep.etqExamen = el.value;

});

    alumnos: [['Sofía', 'Álvarez'], ['Mateo', 'Benítez'], ['Valentina', 'Castro'], ['Benjamín', 'Díaz'], ['Emma', 'Fernández'], ['Joaquín', 'Gómez'], ['Martina', 'López'], ['Thiago', 'Martínez'], ['Catalina', 'Pérez'], ['Lautaro', 'Romero']],
    actividades: [['SUM01', 'Suma de dos cifras sin dificultad', 'cálculo, suma'], ['SUM02', 'Suma con dificultad (llevando)', 'cálculo, suma'], ['RES01', 'Resta de dos cifras sin dificultad', 'cálculo, resta'], ['RES02', 'Resta con dificultad (pidiendo)', 'cálculo, resta'], ['PRB01', 'Problema de una operación', 'problemas, comprensión'], ['PRB02', 'Problema de dos operaciones', 'problemas, comprensión'], ['NUM01', 'Escritura de números hasta 1000', 'numeración'], ['NUM02', 'Anterior y posterior', 'numeración'], ['GEO01', 'Reconocer figuras geométricas', 'geometría'], ['MED01', 'Lectura de la hora', 'medida'], ['LEC01', 'Comprensión de texto breve', 'lectura, comprensión'], ['LEC02', 'Idea principal del texto', 'lectura, comprensión'], ['ESC01', 'Ortografía: uso de mayúsculas', 'escritura, ortografía'], ['ESC02', 'Producción de oración completa', 'escritura']],
    examenes: [['Matemática 1 – 3°A – 2026 – Esc. N°5', '2026-09-15', ['NUM01', 'NUM02', 'SUM01', 'SUM02', 'RES01', 'RES02', 'PRB01', 'PRB02', 'GEO01', 'MED01']], ['Lengua 1 – 3°A – 2026 – Esc. N°5', '2026-09-22', ['LEC01', 'LEC02', 'ESC01', 'ESC02', 'PRB01', 'NUM01', 'SUM01', 'RES01', 'GEO01', 'MED01', 'NUM02']]],
    evaluaciones: ['CCCCCICICC', 'CCCICIIICC', 'CCCCCCCCCC', 'CCNICINNCI', 'CCCCCICCCC', 'CICIIIIICN']
  };
  const p4 = (n, d) => String(n).padStart(d, '0');
  function seed() {
    const db = {
      alumnos: SEED.alumnos.map((a, i) => ({ id: 'A' + p4(i + 1, 4), nombre: a[0], apellido: a[1], activo: true })),
      actividades: SEED.actividades.map(a => ({ codigo: a[0], descripcion: a[1], etiquetas: normTags(a[2]), activo: true })),
      examenes: SEED.examenes.map((e, i) => ({ id: 'E' + p4(i + 1, 4), nombre: e[0], fecha: e[1], activo: true, codigos: e[2] })),
      evaluaciones: [], mods: {}, sesiones: []
    };
    SEED.evaluaciones.forEach((s, i) => {
      const notas = {}; db.examenes[0].codigos.forEach((c, j) => notas[c] = s[j]);
      db.evaluaciones.push({ id: 'V' + p4(i + 1, 5), examenId: 'E0001', alumnoId: 'A' + p4(i + 1, 4), fechaCarga: new Date().toISOString(), fechaEdicion: '', notas });
    });
    return db;
  }
  function load() { try { const x = JSON.parse(localStorage.getItem(KEY)); if (x && x.alumnos) return x; } catch (e) {} return seed(); }
  function save(db) { try { localStorage.setItem(KEY, JSON.stringify(db)); } catch (e) {} }
  const clone = o => JSON.parse(JSON.stringify(o));
  const sesOk = (db, p) => db.sesiones.some(s => s.token === p.token && s.email === p.email);

  function aplicar(db, o) {
    const d = o.data || {}, mod = o.mod || new Date().toISOString();
    const key = o.tipo + ':' + (o.tipo === 'evaluacion' ? d.examenId + '/' + d.alumnoId : (d.id || d.codigo));
    const viejo = db.mods[key] && mod < db.mods[key];
    if (o.op === 'estado') {
      const arr = { alumno: db.alumnos, actividad: db.actividades, examen: db.examenes }[o.tipo];
      const x = arr && arr.find(y => (y.id || y.codigo) === (d.id || d.codigo));
      if (!x) return { ok: false, error: 'No existe ' + (d.id || d.codigo) };
      if (viejo) return { ok: true, ignorado: true };
      x.activo = d.activo === true; db.mods[key] = mod; return { ok: true };
    }
    if (o.op !== 'upsert') return { ok: false, error: 'Operación desconocida' };
    if (viejo) return { ok: true, ignorado: true };
    if (o.tipo === 'alumno') {
      if (!d.id || !String(d.nombre || '').trim() || !String(d.apellido || '').trim()) return { ok: false, error: 'Nombre y apellido son obligatorios.' };
      const a = db.alumnos.find(x => x.id === d.id);
      if (a) { a.nombre = d.nombre; a.apellido = d.apellido; } else db.alumnos.push({ id: d.id, nombre: d.nombre, apellido: d.apellido, activo: true });
    } else if (o.tipo === 'actividad') {
      const c = String(d.codigo || '').toUpperCase();
      if (!/^[A-Z0-9][A-Z0-9_.\-]{0,19}$/.test(c)) return { ok: false, error: 'Código inválido: ' + c };
      if (!String(d.descripcion || '').trim()) return { ok: false, error: 'La descripción es obligatoria.' };
      const a = db.actividades.find(x => x.codigo === c);
      if (a) { a.descripcion = d.descripcion; a.etiquetas = normTags((d.etiquetas || []).join(',')); }
      else db.actividades.push({ codigo: c, descripcion: d.descripcion, etiquetas: normTags((d.etiquetas || []).join(',')), activo: true });
    } else if (o.tipo === 'examen') {
      if (!d.id || !String(d.nombre || '').trim()) return { ok: false, error: 'El nombre del examen es obligatorio.' };
      if (!(d.codigos || []).length) return { ok: false, error: 'El examen necesita al menos una actividad.' };
      const falta = d.codigos.find(c => !db.actividades.some(a => a.codigo === c));
      if (falta) return { ok: false, error: 'No existe la actividad ' + falta };
      const e = db.examenes.find(x => x.id === d.id);
      if (!e) db.examenes.push({ id: d.id, nombre: d.nombre, fecha: d.fecha, activo: true, codigos: d.codigos.slice() });
      else {
        e.nombre = d.nombre; e.fecha = d.fecha; db.mods[key] = mod;
        if (e.codigos.join('|') !== d.codigos.join('|')) {
          if (db.evaluaciones.some(v => v.examenId === e.id)) return { ok: false, error: 'Las actividades de "' + e.nombre + '" están bloqueadas: ya hay alumnos evaluados (nombre y fecha sí se guardaron).' };
          e.codigos = d.codigos.slice();
        }
      }
    } else if (o.tipo === 'evaluacion') {
      const e = db.examenes.find(x => x.id === d.examenId);
      if (!e) return { ok: false, error: 'No existe el examen' };
      if (!db.alumnos.some(x => x.id === d.alumnoId)) return { ok: false, error: 'No existe el alumno' };
      const faltan = e.codigos.filter(c => !['C', 'I', 'N'].includes((d.notas || {})[c]));
      if (faltan.length) return { ok: false, error: 'Faltan calificar: ' + faltan.join(', ') };
      const v = db.evaluaciones.find(x => x.examenId === d.examenId && x.alumnoId === d.alumnoId);
      if (v) { v.notas = clone(d.notas); v.fechaEdicion = new Date().toISOString(); }
      else db.evaluaciones.push({ id: 'V-' + Math.random().toString(16).slice(2, 14), examenId: d.examenId, alumnoId: d.alumnoId, fechaCarga: new Date().toISOString(), fechaEdicion: '', notas: clone(d.notas) });
    } else return { ok: false, error: 'Operación desconocida' };
    db.mods[key] = mod;
    return { ok: true };
  }

  return {
    async call(method, p) {
      await new Promise(r => setTimeout(r, 180));
      if (window.__failNext > 0) { window.__failNext--; throw netError('HTTP 404'); }
      if (FAIL_P && Math.random() < FAIL_P) throw netError('HTTP 404');
      const db = load();
      let r;
      switch (p.action) {
        case 'solicitarPIN': r = /.+@.+/.test(p.email || '') ? { ok: true } : { ok: false, motivo: 'no_encontrado' }; break;
        case 'validarPIN':
          if (p.pin === '123456') { const token = 'demo-' + Math.random().toString(36).slice(2); db.sesiones.push({ email: p.email, token, dispositivo: p.dispositivo }); r = { ok: true, token }; }
          else r = { ok: false, motivo: 'pin_incorrecto', restantes: 2 };
          break;
        case 'validarSesion': r = sesOk(db, p) ? { ok: true } : { ok: false, motivo: 'token_invalido' }; break;
        case 'sync':
          r = sesOk(db, p) ? Object.assign({ ok: true }, clone({ alumnos: db.alumnos, actividades: db.actividades, examenes: db.examenes, evaluaciones: db.evaluaciones }))
            : { ok: false, motivo: 'sesion_invalida', detalle: 'token_invalido' };
          break;
        case 'batch':
          r = sesOk(db, p) ? { ok: true, resultados: (p.ops || []).map(o => Object.assign(aplicar(db, o), { opId: o.opId })) } : { ok: false, motivo: 'sesion_invalida' };
          break;
        default: r = { ok: false, error: 'Acción desconocida: ' + p.action };
      }
      save(db);
      return r;
    }
  };
})();

/* =====================================================================
   Inicio
   ===================================================================== */
(function init() {
  document.title = CONFIG.APP_NAME;
  $('#brandIcon').innerHTML = ICONS.logo;
  $('#brandName').textContent = CONFIG.APP_NAME;
  $('#brandVer').textContent = 'v' + CONFIG.APP_VERSION;
  if (store.get('navCol', false)) document.body.classList.add('nav-col');
  $('#btnLogout').innerHTML = ic('logout');
  $('#btnLogout').onclick = () => {
    const msg = queue.length
      ? 'Hay ' + queue.length + ' cambio(s) sin subir que se perderían. ¿Cerrar sesión igual?'
      : '¿Cerrar sesión? Se borran los datos guardados en este dispositivo (en el Sheet siguen todos).';
    if (confirm(msg)) logout();
  };
  $('#btnTheme').onclick = toggleTheme;
  $('#sync').onclick = abrirPanelSync;
  if (DEMO) $('#demoBar').classList.remove('hidden');
  boot();
})();
</script>
